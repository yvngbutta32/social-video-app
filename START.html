<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralBoost - Launch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 500: '#0ea5e9', 600: '#0284c7' }, accent: { 500: '#f43f5e' }, dark: { 900: '#0f172a', 800: '#1e293b' } }, fontFamily: { sans: ['Inter'] } } }
    }
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-dark-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">
    <!-- Logo -->
    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center mx-auto mb-8 animate-pulse">
      <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 15.652l-3.542 3.55-3.537-3.544M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.753 7.247l3.537 3.543 7.53-7.54"/></svg>
    </div>
    
    <h1 class="text-4xl font-extrabold mb-2">ViralBoost</h1>
    <p class="text-gray-400 mb-8">Social Video Promotion Platform</p>
    
    <!-- Action Buttons -->
    <div class="space-y-4">
      <button onclick="openDemo()" class="w-full py-4 bg-gradient-to-r from-primary-500 to-accent-500 rounded-xl font-semibold text-lg shadow-xl shadow-primary-500/30 hover:from-primary-600 hover:to-accent-600 transition">
        🚀 Open Interactive Demo
      </button>
      
      <button onclick="copyDeploy()" class="w-full py-4 bg-gray-800 border border-gray-700 rounded-xl font-semibold text-lg hover:bg-gray-700 hover:border-gray-600 transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
        Copy One-Command Deploy
      </button>
      
      <a href="DEMO.html" target="_blank" class="w-full py-4 bg-gray-800 border border-gray-700 rounded-xl font-semibold text-lg hover:bg-gray-700 hover:border-gray-600 transition flex items-center justify-center gap-2 block">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        Open DEMO.html in New Tab
      </a>
    </div>
    
    <!-- Deploy Command Display -->
    <div id="cmd-display" class="hidden mt-6">
      <div class="bg-dark-800 rounded-xl p-4 text-left">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-400">Deploy Command (copied!)</span>
          <button onclick="hideCmd()" class="text-gray-500 hover:text-white">×</button>
        </div>
        <pre id="cmd-text" class="text-xs text-green-300 font-mono whitespace-pre-wrap overflow-x-auto"></pre>
      </div>
    </div>
    
    <!-- Status -->
    <div class="mt-8 text-sm text-gray-500 space-y-1">
      <p>📁 Full platform in: <code class="text-gray-400">social-video-app/</code></p>
      <p>🐳 Docker required for full deployment</p>
      <p>🌐 Demo works offline - no install needed</p>
    </div>
  </div>

  <script>
    function openDemo() {
      // Try to open in same window first
      window.location.href = 'DEMO.html';
    }
    
    function copyDeploy() {
      const cmd = `cd social-video-app && ./scripts/generate-secrets.sh && docker-compose up -d postgres redis rabbitmq minio && docker-compose run --rm api-gateway npx prisma migrate dev && docker-compose up -d --build && open https://localhost`;
      navigator.clipboard.writeText(cmd).then(() => {
        showCmd(cmd);
      });
    }
    
    function showCmd(cmd) {
      const display = document.getElementById('cmd-display');
      const text = document.getElementById('cmd-text');
      text.textContent = cmd;
      display.classList.remove('hidden');
    }
    
    function hideCmd() {
      document.getElementById('cmd-display').classList.add('hidden');
    }
    
    // Auto-open demo if ?auto=1
    if (new URLSearchParams(window.location.search).get('auto') === '1') {
      setTimeout(openDemo, 500);
    }
  </script>
</body>
</html>
