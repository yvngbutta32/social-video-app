# Intelligence Worker Configuration
port: 3005
nodeEnv: development

database:
  host: localhost
  port: 5432
  name: social_video
  user: social_video
  password: null # Supply through DB_PASSWORD or deployment secrets.
  ssl: false
  poolSize: 10

redis:
  host: localhost
  port: 6379
  password: null # Supply through REDIS_PASSWORD or deployment secrets.
  db: 0

rabbitmq:
  url: null # Supply through RABBITMQ_URL or deployment secrets.

llm:
  # Self-hosted Ollama OpenAI-compatible endpoint. No external model provider is required.
  baseUrl: http://ollama:11434/v1
  model: llama3.2:3b
  maxTokens: 4096
  temperature: 0.7
  timeoutMs: 120000

tensorflow:
  modelPath: ./models/viral-predictor
  enableGpu: false

trendsWorker:
  url: http://localhost:3004

processorWorker:
  url: http://localhost:3003

apiGateway:
  url: http://localhost:3001

viralThresholds:
  highPotential: 0.75
  mediumPotential: 0.5
  lowPotential: 0.25

hooks:
  maxHooksPerVideo: 5
  hookTypes:
    - question
    - statement
    - story
    - controversy
    - curiosity
    - value
    - fear
    - identity
  platforms:
    - tiktok
    - instagram
    - youtube
    - twitter
    - linkedin

concepts:
  maxConceptsPerTrend: 3
  minTrendScore: 0.6
  platforms:
    - tiktok
    - instagram
    - youtube
    - twitter
    - linkedin

logging:
  level: info
  format: json

health:
  interval: 30000
  timeout: 5000